<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB SEHS Question Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        label {
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        input, select, textarea {
            padding: 10px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }
        
        .btn-secondary:hover {
            background: #cbd5e0;
        }
        
        .output-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e2e8f0;
        }
        
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .output-header h2 {
            color: #2d3748;
            font-size: 20px;
        }
        
        .btn-copy {
            background: #48bb78;
            color: white;
            padding: 8px 16px;
            font-size: 12px;
        }
        
        .btn-copy:hover {
            background: #38a169;
        }
        
        .btn-copy.copied {
            background: #2f855a;
        }
        
        pre {
            background: #2d3748;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .question-list {
            margin-top: 20px;
        }
        
        .question-item {
            background: #f7fafc;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }
        
        .question-info {
            flex: 1;
            font-size: 14px;
            color: #4a5568;
        }
        
        .question-id {
            font-weight: 700;
            color: #667eea;
            margin-right: 10px;
        }
        
        .btn-remove {
            background: #fc8181;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .btn-remove:hover {
            background: #f56565;
        }
        
        .empty-state {
            text-align: center;
            color: #a0aec0;
            padding: 40px;
            font-style: italic;
        }
        
        .btn-edit {
            background: #4299e1;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 6px;
        }
        
        .btn-edit:hover {
            background: #3182ce;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IB SEHS Question Generator</h1>
        <p class="subtitle">Generate JavaScript objects for your IB Sports Exercise Health Science question bank</p>
        
        <form id="questionForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="id">Question ID *</label>
                    <input type="text" id="id" placeholder="e.g., A001" required>
                </div>
                
                <div class="form-group">
                    <label for="section">Section *</label>
                    <select id="section" required>
                        <option value="">Select section</option>
                        <option value="A">A - Anatomy</option>
                        <option value="B">B - Exercise Physiology</option>
                        <option value="C">C - Energy Systems</option>
                        <option value="D">D - Movement Analysis</option>
                        <option value="E">E - Skill in Sport</option>
                        <option value="F">F - Measurement</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="subtopic">Subtopic *</label>
                    <input type="text" id="subtopic" placeholder="e.g., A.1.1" required>
                </div>
                
                <div class="form-group">
                    <label for="marks">Marks *</label>
                    <input type="number" id="marks" min="1" max="20" placeholder="e.g., 2" required>
                </div>
                
                <div class="form-group">
                    <label for="level">Level *</label>
                    <select id="level" required>
                        <option value="">Select level</option>
                        <option value="SL">SL - Standard Level</option>
                        <option value="HL">HL - Higher Level</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="type">Question Type</label>
                    <select id="type">
                        <option value="">Not specified</option>
                        <option value="explain">Explain</option>
                        <option value="describe">Describe</option>
                        <option value="discuss">Discuss</option>
                        <option value="compare">Compare</option>
                        <option value="analyze">Analyze</option>
                    </select>
                </div>
                
                <div class="form-group full-width">
                    <label for="question">Question *</label>
                    <textarea id="question" placeholder="Enter the question text..." required></textarea>
                </div>
                
                <div class="form-group full-width">
                    <label for="markScheme">Mark Scheme *</label>
                    <textarea id="markScheme" placeholder="Enter mark scheme points separated by ✔ symbols..." required></textarea>
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-primary">Add Question</button>
                <button type="button" class="btn-secondary" onclick="clearForm()">Clear Form</button>
                <button type="button" class="btn-secondary" onclick="loadExistingQuestions()">↓ Load from GitHub</button>
            </div>
        </form>
        
        <div class="output-section">
            <div class="output-header">
                <h2>Generated Code</h2>
                <button class="btn-copy" onclick="copyCode()">Copy Code</button>
            </div>
            
            <div id="questionList" class="question-list">
                <div class="empty-state">No questions added yet. Fill out the form above to generate code.</div>
            </div>
            
            <pre id="output"><code>// Your generated code will appear here...</code></pre>
        </div>
    </div>

    <script>
        let questions = [];
        
        document.getElementById('questionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            addQuestion();
        });
        
        function addQuestion() {
            const newId = document.getElementById('id').value;
            
            // Check for duplicate ID
            const existingQuestion = questions.find(q => q.id === newId);
            
            if (existingQuestion) {
                const update = confirm(
                    `Question ID "${newId}" already exists!\n\n` +
                    `Existing: ${existingQuestion.question.substring(0, 60)}...\n\n` +
                    `Click OK to UPDATE the existing question, or Cancel to go back.`
                );
                
                if (update) {
                    updateQuestion(newId);
                } else {
                    // Highlight the ID field to show where the duplicate is
                    const idField = document.getElementById('id');
                    idField.style.borderColor = '#fc8181';
                    idField.style.background = '#fff5f5';
                    setTimeout(() => {
                        idField.style.borderColor = '';
                        idField.style.background = '';
                    }, 2000);
                }
                return;
            }
            
            // Add new question
            const question = {
                id: newId,
                section: document.getElementById('section').value,
                subtopic: document.getElementById('subtopic').value,
                marks: parseInt(document.getElementById('marks').value),
                level: document.getElementById('level').value,
                question: document.getElementById('question').value,
                markScheme: document.getElementById('markScheme').value
            };
            
            // Add type if specified
            const type = document.getElementById('type').value;
            if (type) {
                question.type = type;
            }
            
            questions.push(question);
            updateOutput();
            updateQuestionList();
            clearForm();
            
            // Show success feedback
            showSuccess('✓ Added!');
        }
        
        function updateQuestion(id) {
            const index = questions.findIndex(q => q.id === id);
            
            questions[index] = {
                id: id,
                section: document.getElementById('section').value,
                subtopic: document.getElementById('subtopic').value,
                marks: parseInt(document.getElementById('marks').value),
                level: document.getElementById('level').value,
                question: document.getElementById('question').value,
                markScheme: document.getElementById('markScheme').value
            };
            
            const type = document.getElementById('type').value;
            if (type) {
                questions[index].type = type;
            }
            
            updateOutput();
            updateQuestionList();
            clearForm();
            
            showSuccess('✓ Updated!', '#48bb78');
        }
        
        function showSuccess(message, color = '#48bb78') {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.textContent;
            const originalBg = btn.style.background;
            btn.textContent = message;
            btn.style.background = color;
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = originalBg;
            }, 1500);
        }
        
        function updateOutput() {
            const output = document.getElementById('output');
            const code = questions.map(q => {
                let obj = `{id: "${q.id}", section: "${q.section}", subtopic: "${q.subtopic}", marks: ${q.marks}, level: "${q.level}"`;
                if (q.type) {
                    obj += `, type: "${q.type}"`;
                }
                obj += `, question: "${q.question}", markScheme: "${q.markScheme}"}`;
                return obj;
            }).join(',\n');
            
            output.innerHTML = `<code>${code || '// Your generated code will appear here...'}</code>`;
        }
        
        function updateQuestionList() {
            const listDiv = document.getElementById('questionList');
            
            if (questions.length === 0) {
                listDiv.innerHTML = '<div class="empty-state">No questions added yet. Fill out the form above to generate code.</div>';
                return;
            }
            
            listDiv.innerHTML = questions.map((q, index) => `
                <div class="question-item">
                    <div class="question-info">
                        <span class="question-id">${q.id}</span>
                        <span>${q.subtopic} | ${q.level} | ${q.marks} marks</span>
                    </div>
                    <div>
                        <button class="btn-edit" onclick="editQuestion(${index})">Edit</button>
                        <button class="btn-remove" onclick="removeQuestion(${index})">Remove</button>
                    </div>
                </div>
            `).join('');
        }
        
        function editQuestion(index) {
            const q = questions[index];
            document.getElementById('id').value = q.id;
            document.getElementById('section').value = q.section;
            document.getElementById('subtopic').value = q.subtopic;
            document.getElementById('marks').value = q.marks;
            document.getElementById('level').value = q.level;
            document.getElementById('type').value = q.type || '';
            document.getElementById('question').value = q.question;
            document.getElementById('markScheme').value = q.markScheme;
            
            // Scroll to form
            document.getElementById('questionForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
            
            // Highlight the form
            const form = document.getElementById('questionForm');
            form.style.background = '#fef5e7';
            setTimeout(() => {
                form.style.background = '';
            }, 2000);
        }
        
        function removeQuestion(index) {
            const q = questions[index];
            if (confirm(`Remove question ${q.id}?`)) {
                questions.splice(index, 1);
                updateOutput();
                updateQuestionList();
            }
        }
        
        function clearForm() {
            document.getElementById('questionForm').reset();
            document.getElementById('id').focus();
        }
        
        function copyCode() {
            const output = document.getElementById('output').textContent;
            
            if (output.includes('Your generated code will appear here')) {
                alert('No code to copy yet. Add some questions first!');
                return;
            }
            
            navigator.clipboard.writeText(output).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.textContent = '✓ Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy Code';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('Failed to copy code. Please select and copy manually.');
            });
        }
        
        // Load existing questions from GitHub
        function loadExistingQuestions() {
            const loadBtn = event.target;
            loadBtn.textContent = '⏳ Loading...';
            loadBtn.disabled = true;
            
            fetch('https://raw.githubusercontent.com/JamieR7/sehsexam/refs/heads/main/allQuestions.js')
                .then(response => response.text())
                .then(data => {
                    // Extract the array from the JavaScript file
                    try {
                        // Remove any variable declarations and get just the array
                        const match = data.match(/\[[\s\S]*\]/);
                        if (match) {
                            // Replace single quotes with double quotes for JSON parsing
                            const jsonString = match[0]
                                .replace(/(\w+):/g, '"$1":')  // Add quotes around keys
                                .replace(/:\s*'([^']*)'/g, ': "$1"');  // Replace single quotes with double
                            
                            const questionsArray = JSON.parse(jsonString);
                            questions = questionsArray;
                            updateOutput();
                            updateQuestionList();
                            alert(`✓ Successfully loaded ${questions.length} existing questions from GitHub!`);
                        } else {
                            throw new Error('Could not find array in file');
                        }
                    } catch (err) {
                        console.error('Could not parse questions:', err);
                        alert('Could not parse the questions file. Check console for details.');
                    }
                })
                .catch(err => {
                    console.error('Could not load existing questions:', err);
                    alert('Could not connect to GitHub. Check your internet connection or file URL.');
                })
                .finally(() => {
                    loadBtn.textContent = '↓ Load from GitHub';
                    loadBtn.disabled = false;
                });
        }
    </script>
</body>
</html>
